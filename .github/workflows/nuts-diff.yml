name: NutsEmu source list
on:
  push:
    branches: [nuts-diff]
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the NutsEmu source index
        run: |
          set -e
          mkdir -p out
          curl -fsSL -A "Mozilla/5.0" -o out/source-index.html https://nutsdeveloping.com/source/
          curl -fsSL -A "Mozilla/5.0" -o out/downloads-index.html https://nutsdeveloping.com/source/downloads/ || true
          grep -oiE 'href="[^"]+"' out/source-index.html out/downloads-index.html | sort -u > out/links.txt || true
          grep -oE 'nutsemu-[0-9]+|SHA256SUMS-nutsemu-[0-9]+\.txt' out/links.txt | sort -u > out/builds.txt || true
          wc -l out/*
      - name: Commit results to nuts-diff-out
        run: |
          cd out
          git init -q -b nuts-diff-out
          git config user.name github-actions; git config user.email actions@github.com
          git add -A && git commit -qm "NutsEmu source index $(date -u +%F)"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} nuts-diff-out 2>&1 | tail -3
