# Temporary: fetch Valve's pinned client packages (the ones Madeira itself
# downloads for Dock) and keep the client DLLs one day for inspection.
name: Inspect Steam client
on:
  push:
    branches: [inspect-client]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned packages
        run: |
          set -eu
          O=https://client-update.akamai.steamstatic.com/
          curl -sSfL -o jan.zip "${O}bins_win64_win32.zip.f29d67dc38a4be027f1734802697c668621a6da1"
          echo "345f6e4bdc19b27ae53bf752c21e2d894e0e899d94823222fb426e890d1226b5  jan.zip" | sha256sum -c
          mkdir out && python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('jan.zip')
          for n in z.namelist():
              if n.lower().endswith('steamclient64.dll'):
                  open('out/steamclient64-jan.dll','wb').write(z.read(n)); print('jan', n)
          PY
          # The September build Dock also supports: manifest names its package.
          curl -sSfL -o manifest.txt "${O}steam_client_win32" || true
          grep -o 'bins_win64_win32.zip.[0-9a-f]*' manifest.txt | sort -u | head -5 || true
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: steamclient-dlls
          path: out/
          retention-days: 1
