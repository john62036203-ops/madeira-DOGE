# Temporary: compile-check the patched Dock host with MinGW (no IPA build).
name: Inspect Steam client
on:
  push:
    branches: [inspect-client]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Compile-check dockhost with the presence patch
        shell: bash
        run: |
          set +e
          R=$(mktemp -d); exec > >(tee "$R/RESULT.txt") 2>&1
          git submodule update --init --depth 1 madeira-dock
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 >/dev/null 2>&1; x86_64-w64-mingw32-gcc --version | head -1
          T=$(mktemp -d); cp madeira-dock/src/*.c madeira-dock/src/*.h "$T/"
          python3 tools/patch-dock-game-scm.py "$T/launch.c"
          python3 tools/patch-dock-keep-alive.py "$T/launch.c"
          python3 tools/patch-dock-presence.py "$T/session.c"; echo "patch=$?"
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-cast-function-type \
            -static -I"$T" -o "$T/dockhost.exe" "$T"/*.c -ladvapi32; echo "compile=$?"
          ls -la "$T/dockhost.exe"
          (cd madeira-dock && bash tools/check.sh 2>&1 | tail -5)
          grep -n "madeira_presence\|presence_done" "$T/session.c"
          cd "$R" && git init -q -b inspect-results && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "check ${{ github.run_number }}" && \
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-results 2>&1 | tail -2
          true
