# Temporary: inspect Valve's pinned steamclient64.dll (the one Madeira downloads); text results only.
name: Inspect Steam client
on:
  push:
    branches: [inspect-client]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, inspect, publish text
        shell: bash
        run: |
          set +e
          R=$(mktemp -d); exec > >(tee "$R/RESULT.txt") 2>&1
          O=https://client-update.akamai.steamstatic.com/
          curl -sSfL -o p.zip "${O}bins_win32.zip.23e34a6d4b10596a44561a5100dac5585d2517da"
          echo "8b712b2a3412a9066b7725f4e1c5cef9a7ca5b187b6585a5b92d25d09df0ba62  p.zip" | sha256sum -c
          python3 -c "import zipfile; z=zipfile.ZipFile('p.zip'); n=[x for x in z.namelist() if x.lower().endswith('steamclient64.dll')][0]; open('steamclient64.dll','wb').write(z.read(n))"
          python3 .github/inspect-client.py steamclient64.dll
          cd "$R" && git init -q -b inspect-results && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -qm "inspect ${{ github.run_number }}" && \
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-results 2>&1 | tail -2
          true
