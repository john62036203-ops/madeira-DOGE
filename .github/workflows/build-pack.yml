name: Build Madeira update pack

# madeira-bcd: an update pack carries the PE half that changes most often --
# the D3D12 runtime (madeira_d3d12.dll, shipped as d3d12.dll too) -- so a fix
# there reaches the phone from Settings > Updates in the app, with no IPA to
# sign and install. Minutes instead of the full build's quarter hour, and it
# needs none of Wine, FEX, LLVM or the Metal Shader Converter.
#
# A pack is only valid over an app whose native half matches:
# tools/native-abi.sh hashes that half the same way here and in the IPA build,
# and the app refuses a pack whose native_abi differs from its own. When the
# native half changed, build a new IPA first.
#
# Published on the rolling "packs" prerelease (tools/pack-index.py): DLLs built
# from this repository and an index.json. Never an IPA or a third-party binary.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the pack on the "packs" release, where the app finds it
        type: boolean
        default: true
  push:
    branches: [claude/madeira-bcd-repo-ymg5cb]
    paths:
      - research/madeira-d3d12/src/pe/**
      - tools/build-madeira-d3d12-dll.sh
      - .github/workflows/build-pack.yml

concurrency:
  group: build-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Only DXMT: madeira_d3d12 compiles against its winemetal.h (as patched
      # below). Wine and FEX stay unfetched; native-abi.sh reads their
      # commits from the index.
      - name: Fetch the DXMT submodule
        shell: bash
        run: |
          git submodule update --init --depth 1 research/dxmt \
            || git submodule update --init research/dxmt

      - name: Select newest Xcode
        shell: bash
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
            echo "::notice::selected $NEWEST"
          fi

      # The helper kernels (mad_kernels.metal) need the Metal compiler.
      - name: Ensure Metal compiler
        shell: bash
        run: |
          if xcrun -sdk macosx metal --version 2>&1 | head -3; then
            echo "::notice::metal compiler already present"
          else
            xcodebuild -downloadComponent MetalToolchain \
              || echo "::warning::-downloadComponent unsupported on this Xcode"
          fi

      - name: Restore llvm-mingw
        id: mingwcache
        uses: actions/cache/restore@v4
        with:
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: llvm-mingw-20260421-ucrt-macos-universal

      - name: Fetch llvm-mingw
        if: steps.mingwcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p toolchains
          URL=https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          for try in 1 2 3; do
            curl -fL --retry 3 --retry-delay 5 -o /tmp/mingw.tar.xz "$URL" && break
            sleep $((try * 5))
          done
          SZ=$(wc -c < /tmp/mingw.tar.xz 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then
            echo "::error::llvm-mingw download failed ($SZ bytes)"; exit 1
          fi
          tar -xJf /tmp/mingw.tar.xz -C toolchains/

      # The same source patches the IPA build applies: madeira_d3d12 uses the
      # patched winemetal.h (DXIL tessellation, GPU fault info). Their unix
      # halves are not built here.
      - name: Patch DXMT sources
        shell: bash
        run: |
          python3 tools/patch-dxmt-frame-limits.py
          python3 tools/patch-dxmt-gpu-fault-info.py
          python3 tools/patch-dxmt-b2t-aspect.py
          python3 tools/patch-dxmt-dxil-tess.py

      - name: Build madeira_d3d12.dll
        shell: bash
        run: |
          export MAD_PACK_ID="pack ${{ github.run_number }} ($(git rev-parse --short HEAD))"
          bash tools/build-madeira-d3d12-dll.sh

      - name: Assemble the pack
        id: pack
        shell: bash
        run: |
          ABI=$(bash tools/native-abi.sh)
          rm -rf pack && mkdir -p pack/arm64ec-windows
          cp build/madeira-d3d12/out-pe/madeira_d3d12.dll pack/arm64ec-windows/madeira_d3d12.dll
          cp build/madeira-d3d12/out-pe/madeira_d3d12.dll pack/arm64ec-windows/d3d12.dll
          python3 - "$ABI" <<'PYEOF'
          import datetime, hashlib, json, os, subprocess, sys
          files = []
          for root, _, names in os.walk("pack"):
              for n in sorted(names):
                  p = os.path.join(root, n)
                  rel = os.path.relpath(p, "pack")
                  data = open(p, "rb").read()
                  files.append({"path": rel, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)})
          sha = os.environ["GITHUB_SHA"]
          subject = subprocess.run(["git", "log", "-1", "--format=%s", sha], capture_output=True, text=True).stdout.strip()
          man = {
              "format": 1,
              "kind": "madeira-pack",
              "build": int(os.environ["RUN"]),
              "commit": sha,
              "branch": os.environ["GITHUB_REF_NAME"],
              "created": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "native_abi": sys.argv[1],
              "notes": subject,
              "files": files,
          }
          json.dump(man, open("pack/madeira-pack.json", "w"), indent=1)
          print(json.dumps(man, indent=1))
          PYEOF
          (cd pack && zip -q -r -X "../madeira-pack-${{ github.run_number }}.zip" .)
          echo "::notice::pack ${{ github.run_number }} for native ABI $ABI ($(wc -c < madeira-pack-${{ github.run_number }}.zip | tr -d ' ') bytes)"
        env:
          RUN: ${{ github.run_number }}

      # The artifact is the pack itself (madeira-pack.json at its root): the
      # zip GitHub hands out can be opened in Madeira directly.
      - uses: actions/upload-artifact@v4
        with:
          name: madeira-pack-${{ github.run_number }}
          path: pack/

      - name: Publish on the packs release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/pack-index.py add-pack "madeira-pack-${{ github.run_number }}.zip" pack/madeira-pack.json
